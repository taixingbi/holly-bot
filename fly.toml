# fly.toml app configuration file generated for holly-bot on 2026-02-01T20:27:04-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# Required secrets (set before deploy): OPENAI_API_KEY, MCP_URL, MCP_SQL_TOOL
#   fly secrets set OPENAI_API_KEY="..." MCP_URL="https://mcp-tool-sql.fly.dev/mcp/" MCP_SQL_TOOL="sql_agent"
#

app = 'holly-bot'
primary_region = 'ewr'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
